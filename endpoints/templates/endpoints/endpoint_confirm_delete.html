{% extends "base.html" %}

{% block title %}Delete {{ endpoint.name }} | API Vault{% endblock %}

{% block content %}
    <div class="content-narrow">
        <section class="panel danger-panel">
            <p class="eyebrow">Confirm deletion</p>
            <h1>Delete {{ endpoint.name }}?</h1>

            <p>This permanently deletes the saved API endpoint.</p>

            <form class="form-actions" method="post">
                {% csrf_token %}
                <button class="button button-danger" type="submit">
                    Yes, delete endpoint
                </button>
                <a class="button button-secondary" href="{% url 'endpoints:endpoint-detail' endpoint.pk %}">
                    Cancel
                </a>
            </form>
        </section>
    </div>
{% endblock %}
