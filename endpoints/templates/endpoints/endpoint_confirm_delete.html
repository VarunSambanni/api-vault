{% extends "base.html" %}

{% block title %}Delete {{ endpoint.name }} | API Vault{% endblock %}

{% block content %}
    <h1>Delete {{ endpoint.name }}?</h1>

    <p>This permanently deletes the saved API endpoint.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete endpoint</button>
    </form>

    <p>
        <a href="{% url 'endpoints:endpoint-detail' endpoint.pk %}">
            Cancel
        </a>
    </p>
{% endblock %}
