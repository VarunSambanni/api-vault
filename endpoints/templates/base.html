{% load static %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}API Vault{% endblock %}
    </title>
</head>
<body>
    <header>
        <nav>
            {% if user.is_authenticated %}
            <span>Signed in as {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            {% endif %}
            <a href="{% url 'endpoints:endpoint-list' %}">
                API Vault
            </a>
            <a href="{% url 'endpoints:endpoint-create' %}">
                Add endpoint
            </a>
            <a href="{% url 'endpoints:organization-list' %}">
                Categories and tags
            </a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
